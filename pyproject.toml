[project]
name = "spotiframe"
version = "0.1.0"
description = "A Spotify album art frame for Raspberry Pi and Pimoroni Inky"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.3,<14",
    "python-dotenv>=1,<2",
    "qrcode>=7.4,<9",
]

[project.optional-dependencies]
pi = ["inky>=2.6,<3; sys_platform == 'linux'"]

[tool.uv]
package = false
